name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://fenceline:fenceline@localhost:5433/fenceline
      TEST_DATABASE_URL: postgres://fenceline:fenceline@localhost:5433/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: start postgres
        run: |
          docker compose up -d postgres
          until docker compose exec -T postgres pg_isready -U fenceline -d fenceline; do sleep 1; done

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go build ./...
      - run: go vet ./...

      - name: apply migrations to an empty database
        run: go run ./cmd/migrate

      - name: migrations are idempotent
        run: go run ./cmd/migrate

      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
