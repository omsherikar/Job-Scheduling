name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fenceline
          POSTGRES_PASSWORD: fenceline
          POSTGRES_DB: fenceline
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fenceline -d fenceline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://fenceline:fenceline@localhost:5433/fenceline
      TEST_DATABASE_URL: postgres://fenceline:fenceline@localhost:5433/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go build ./...
      - run: go vet ./...

      - name: apply migrations to an empty database
        run: go run ./cmd/migrate

      - name: migrations are idempotent
        run: go run ./cmd/migrate

      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
