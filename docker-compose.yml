services:
  postgres:
    image: postgres:17-alpine
    container_name: fenceline-pg
    environment:
      POSTGRES_USER: fenceline
      POSTGRES_PASSWORD: fenceline
      POSTGRES_DB: fenceline
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fenceline -d fenceline"]
      interval: 2s
      timeout: 3s
      retries: 30
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - autovacuum_naptime=5s
      - -c
      - autovacuum_vacuum_cost_delay=2ms
      - -c
      - log_min_duration_statement=250ms
      - -c
      - log_lock_waits=on
      - -c
      - track_io_timing=on
volumes:
  pgdata:
